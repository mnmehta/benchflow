# GuideLLM 8000/1000, same client shape as guidellm-concurrent-1k-1k-c450
# (450s/stream, ascending 1…500). Serve must allow ≥9000 context
# (rhaiis-kimi-k3-tp8-pp2-humming-8k uses --max-model-len=16384).
apiVersion: benchflow.io/v1alpha1
kind: BenchmarkProfile
metadata:
  name: guidellm-concurrent-8k-1k-c450
spec:
  guidellm:
    backend:
      kind: openai_http
    profile:
      kind: concurrent
    override:
      # GuideLLM walks this list in order (low→high).
      profile.streams: [1, 50, 100, 150, 200, 300, 400, 500]
    data:
      kind: synthetic_text
      prompt_tokens: 8000
      output_tokens: 1000
    constraint:
      - kind: max_duration
        seconds: 450
    tokenizer:
      kind: huggingface_auto
      load_kwargs:
        trust_remote_code: true
  env:
    GUIDELLM__LOGGING__CONSOLE_LOG_LEVEL: "DEBUG"
