# GuideLLM 1000/1000 SGLang concurrency sweep. Same stream ladder and 450s
# duration as guidellm-concurrent-1k-1k-c450 (old SGLang profile was 120s
# to match TARGET_SECS in bench-concurrency-sweep.sh).
apiVersion: benchflow.io/v1alpha1
kind: BenchmarkProfile
metadata:
  name: guidellm-sglang-conc-1k-1k-c450
spec:
  guidellm:
    backend:
      kind: openai_http
    profile:
      kind: concurrent
    override:
      # GuideLLM walks this list in order (low→high).
      profile.streams: [1, 50, 100, 150, 200, 300, 400, 500]
    data:
      kind: synthetic_text
      prompt_tokens: 1000
      output_tokens: 1000
    constraint:
      - kind: max_duration
        seconds: 450
    tokenizer:
      kind: huggingface_auto
      load_kwargs:
        trust_remote_code: true
  requirements:
    # SGLang serve scripts default --context-length 8192.
    min_max_model_len: 8192
  env:
    GUIDELLM__LOGGING__CONSOLE_LOG_LEVEL: "DEBUG"
