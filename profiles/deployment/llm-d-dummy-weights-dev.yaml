apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: llm-d-dummy-weights-dev
spec:
  platform: llm-d
  mode: inference-scheduling
  repo_url: https://github.com/llm-d/llm-d.git
  repo_ref: v0.6.0
  gateway: istio
  endpoint_path: /v1/models
  model_storage:
    pvc_name: models-storage
    cache_dir: /models
    mount_path: /model-cache
  runtime:
    image: vllm/vllm-openai:glm51
    replicas: 1
    tensor_parallelism: 8
    use_dummy_weights: true  # Use random weights for fast startup
    env:
      HOME: /tmp  # Set HOME so TensorRT-LLM uses /tmp/.tensorrt_llm instead of /.tensorrt_llm
      TRITON_CACHE_DIR: /tmp/.triton
      VLLM_CACHE_ROOT: /tmp/.vllm_cache
    vllm_args:
      - --trust-remote-code
      - --enable-prefix-caching
