apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: rhaiis-kimi-k3-tp8-pp2-sglang-8k
  annotations:
    benchflow.io/description: >
      TP8×PP2 SGLang for 8k/1k GuideLLM (context-length raised past 8k+1k).
      Node pool pinned to g13c364 + g1191e4 so 8k humming can occupy
      gc37d78 + gf2a612 at the same time (2 nodes each).
spec:
  platform: rhaiis
  mode: raw-sglang
  endpoint_path: /v1/models
  runtime:
    image: lmsysorg/sglang:kimi-k3
    service_account_name: benchflow-hostpath-runtime
    replicas: 2
    tensor_parallelism: 8
    host_paths:
      - name: kimi-k3-models
        host_path: /mnt/local/kimi-k3/models
        mount_path: /models
        type: Directory
        read_only: true
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    # Same pair as 1k-1k SGLang. 8k humming uses the other two.
                    - g13c364
                    - g1191e4
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: "16"
        memory: 64Gi
        ephemeral-storage: 50Gi
        rdma/ib: "1"
      limits:
        nvidia.com/gpu: "8"
        rdma/ib: "1"
    env:
      HF_HOME: /models/hf
      HF_HUB_CACHE: /models/hf/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_CACHE: /models/hf/hub
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
      NCCL_MNNVL_ENABLE: "1"
      NCCL_CUMEM_ENABLE: "1"
      SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: "0"
      NCCL_DMABUF_ENABLE: "0"
      NCCL_IB_HCA: mlx5_5
      NCCL_IB_GID_INDEX: "3"
      PYTHONHASHSEED: "42"
    sglang_args:
      - --pp-size=2
      - --moe-runner-backend=marlin
      - --decode-attention-backend=flashmla
      - --enable-symm-mem
      - --mem-fraction-static=0.90
      - --reasoning-parser=kimi_k3
      - --tool-call-parser=kimi_k3
      - --mamba-full-memory-ratio=0.90
      - --context-length=16384
      - --mamba-ssm-dtype=bfloat16
      - --max-running-requests=256
  options:
    model_path: /models/Kimi-K3
    distributed:
      enabled: true
      launch_style: sglang-nnodes
      head_start_delay_seconds: 45
      # Distinct from the 1k-1k STS master_port on the other nodes (hostNetwork).
      master_port: 20001
      host_network: true
      host_ipc: true
