apiVersion: benchflow.io/v1alpha1
kind: DeploymentProfile
metadata:
  name: rhaiis-kimi-k3-tp8-pp2-humming-8k
  annotations:
    benchflow.io/description: >
      TP8×PP2 humming for 8k/1k GuideLLM (max-model-len raised past 8k+1k).
      Node pool pinned to the two H200s left free while the 1k-1k PP2 run
      occupies g13c364 + g1191e4.
spec:
  platform: rhaiis
  mode: raw-vllm
  endpoint_path: /v1/models
  runtime:
    image: vllm/vllm-openai:kimi-k3
    service_account_name: benchflow-hostpath-runtime
    replicas: 2
    tensor_parallelism: 8
    host_paths:
      - name: kimi-k3-models
        host_path: /mnt/local/kimi-k3/models
        mount_path: /models
        type: Directory
        read_only: true
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    # Free while 1k-1k holds g13c364 + g1191e4.
                    - gc37d78
                    - gf2a612
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    resources:
      requests:
        cpu: "16"
        memory: 64Gi
        ephemeral-storage: 50Gi
        rdma/ib: "1"
      limits:
        nvidia.com/gpu: "8"
        rdma/ib: "1"
    env:
      HF_HOME: /models/hf
      HF_HUB_CACHE: /models/hf/hub
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_CACHE: /models/hf/hub
      TRANSFORMERS_OFFLINE: "1"
      VLLM_ENGINE_READY_TIMEOUT_S: "7200"
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
      VLLM_USE_RUST_FRONTEND: "0"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      NCCL_CUMEM_ENABLE: "1"
      NCCL_DMABUF_ENABLE: "0"
      NCCL_IB_HCA: mlx5_5
      NCCL_IB_GID_INDEX: "3"
      PYTHONHASHSEED: "42"
    vllm_args:
      - --pipeline-parallel-size=2
      - --gpu-memory-utilization=0.90
      - --max-num-seqs=256
      # 8k prompt + 1k output needs >8192.
      - --max-model-len=16384
      - --max-num-batched-tokens=8192
      - --attention-backend=FLASHMLA
      - --moe-backend=humming
      - --disable-custom-all-reduce
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser=kimi_k3
      - --reasoning-parser=kimi_k3
  options:
    model_path: /models/Kimi-K3
    distributed:
      enabled: true
      launch_style: ix-agg
      head_start_delay_seconds: 45
      # Distinct from the 1k-1k STS master_port on the other nodes (hostNetwork).
      master_port: 29501
      host_network: true
      host_ipc: true
